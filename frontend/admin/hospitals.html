<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hospitals List - BloodLink Admin</title>
  <link rel="stylesheet" href="/css/style.css">
  <link rel="stylesheet" href="/css/dashboard.css">
  <link rel="stylesheet" href="/css/responsive.css">
</head>
<body>

  <nav class="navbar">
    <div class="navbar-container">
      <a href="/index.html" class="logo"><span class="logo-icon">🩸</span> BloodLink</a>
      <div id="navDynamicLinks"></div>
    </div>
  </nav>

  <div class="dashboard-layout">
    <aside class="sidebar">
      <div class="sidebar-profile">
        <div class="avatar">🏥</div>
        <div class="sidebar-name">Hospitals Directory</div>
        <div class="sidebar-role">Administrator</div>
      </div>
      <ul class="sidebar-nav">
        <li><a href="/admin/dashboard.html" class="sidebar-link"><span class="icon">📊</span> Dashboard Overview</a></li>
        <li><a href="/admin/users.html" class="sidebar-link"><span class="icon">👥</span> Manage Users</a></li>
        <li><a href="/admin/donors.html" class="sidebar-link"><span class="icon">🩸</span> Donors List</a></li>
        <li><a href="/admin/hospitals.html" class="sidebar-link active"><span class="icon">🏥</span> Hospitals List</a></li>
        <li><a href="/admin/requests.html" class="sidebar-link"><span class="icon">🚨</span> Blood Requests</a></li>
      </ul>
    </aside>

    <main class="main-content">
      <div class="dashboard-header">
        <div class="dashboard-title">
          <h2>🏥 Hospitals Directory</h2>
          <p>Registered hospital accounts and contact information</p>
        </div>
      </div>

      <div class="table-responsive">
        <table class="table">
          <thead>
            <tr>
              <th>ID</th>
              <th>Hospital Name</th>
              <th>Email</th>
              <th>Phone</th>
              <th>Location</th>
              <th>Status</th>
            </tr>
          </thead>
          <tbody id="adminHospitalsTableBody">
            <!-- Loaded dynamically via admin.js -->
          </tbody>
        </table>
      </div>
    </main>
  </div>

  <script src="/js/api.js"></script>
  <script src="/js/auth.js"></script>
  <script src="/js/admin.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', loadAdminHospitalsTable);
  </script>
</body>
</html>
