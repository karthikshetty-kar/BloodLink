<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>User Management - BloodLink Admin</title>
  <link rel="stylesheet" href="/css/style.css">
  <link rel="stylesheet" href="/css/dashboard.css">
  <link rel="stylesheet" href="/css/responsive.css">
</head>
<body>

  <nav class="navbar">
    <div class="navbar-container">
      <a href="/index.html" class="logo"><span class="logo-icon">🩸</span> BloodLink</a>
      <div id="navDynamicLinks"></div>
    </div>
  </nav>

  <div class="dashboard-layout">
    <aside class="sidebar">
      <div class="sidebar-profile">
        <div class="avatar">👥</div>
        <div class="sidebar-name">User Accounts</div>
        <div class="sidebar-role">Administrator</div>
      </div>
      <ul class="sidebar-nav">
        <li><a href="/admin/dashboard.html" class="sidebar-link"><span class="icon">📊</span> Dashboard Overview</a></li>
        <li><a href="/admin/users.html" class="sidebar-link active"><span class="icon">👥</span> Manage Users</a></li>
        <li><a href="/admin/donors.html" class="sidebar-link"><span class="icon">🩸</span> Donors List</a></li>
        <li><a href="/admin/hospitals.html" class="sidebar-link"><span class="icon">🏥</span> Hospitals List</a></li>
        <li><a href="/admin/requests.html" class="sidebar-link"><span class="icon">🚨</span> Blood Requests</a></li>
      </ul>
    </aside>

    <main class="main-content">
      <div class="dashboard-header">
        <div class="dashboard-title">
          <h2>👥 System User Management</h2>
          <p>Search, inspect, and toggle active/disabled user account statuses</p>
        </div>
      </div>

      <div class="card" style="margin-bottom: 1.5rem;">
        <div style="display: flex; gap: 1rem; flex-wrap: wrap;">
          <input type="text" id="userSearchInput" class="form-control" placeholder="Search name, email, or city..." style="flex: 1; min-width: 200px;">
          <select id="roleFilterSelect" class="form-control" style="width: 200px;">
            <option value="">All Roles</option>
            <option value="Donor">Donor</option>
            <option value="Blood Seeker">Blood Seeker</option>
            <option value="Hospital">Hospital</option>
            <option value="Admin">Admin</option>
          </select>
        </div>
      </div>

      <div class="table-responsive">
        <table class="table">
          <thead>
            <tr>
              <th>ID</th>
              <th>Name</th>
              <th>Email</th>
              <th>Phone</th>
              <th>Role</th>
              <th>Location</th>
              <th>Status</th>
              <th>Action</th>
            </tr>
          </thead>
          <tbody id="adminUsersTableBody">
            <!-- Loaded dynamically via admin.js -->
          </tbody>
        </table>
      </div>
    </main>
  </div>

  <script src="/js/api.js"></script>
  <script src="/js/auth.js"></script>
  <script src="/js/admin.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', loadAdminUsersTable);
  </script>
</body>
</html>
