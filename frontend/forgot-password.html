<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reset Password - BloodLink</title>
  <link rel="stylesheet" href="/css/style.css">
  <link rel="stylesheet" href="/css/auth.css">
  <link rel="stylesheet" href="/css/responsive.css">
</head>
<body>

  <nav class="navbar">
    <div class="navbar-container">
      <a href="/index.html" class="logo"><span class="logo-icon">🩸</span> BloodLink</a>
      <div id="navDynamicLinks">
        <a href="/login.html" class="btn btn-outline btn-sm">Login</a>
      </div>
    </div>
  </nav>

  <div class="auth-page">
    <div class="auth-card">
      <div class="auth-header">
        <h2>Reset Password</h2>
        <p>Enter your email address to receive password reset instructions</p>
      </div>

      <div id="alertContainer"></div>

      <form id="forgotPasswordForm">
        <div class="form-group">
          <label for="email">Registered Email Address</label>
          <input type="email" id="email" class="form-control" placeholder="e.g. rahul@gmail.com" required>
        </div>

        <button type="submit" class="btn btn-primary" style="width: 100%; padding: 0.8rem;">Send Reset Request</button>
      </form>

      <div class="auth-footer">
        Remembered your password? <a href="/login.html">Login here</a>
      </div>
    </div>
  </div>

  <script src="/js/api.js"></script>
  <script>
    document.getElementById('forgotPasswordForm').addEventListener('submit', (e) => {
      e.preventDefault();
      showAlert('alertContainer', 'For demonstration purposes, password reset instructions have been sent to your email. (Demo account default password is 123456)', 'success');
    });
  </script>
</body>
</html>
