<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Manage Requests - BloodLink</title>
  <link rel="stylesheet" href="/css/style.css">
  <link rel="stylesheet" href="/css/dashboard.css">
  <link rel="stylesheet" href="/css/responsive.css">
</head>
<body>

  <nav class="navbar">
    <div class="navbar-container">
      <a href="/index.html" class="logo"><span class="logo-icon">🩸</span> BloodLink</a>
      <div id="navDynamicLinks"></div>
    </div>
  </nav>

  <div class="dashboard-layout">
    <aside class="sidebar">
      <div class="sidebar-profile">
        <div class="avatar">📋</div>
        <div class="sidebar-name">Requests</div>
        <div class="sidebar-role">Hospital Requests</div>
      </div>
      <ul class="sidebar-nav">
        <li><a href="/hospital/dashboard.html" class="sidebar-link"><span class="icon">📊</span> Dashboard</a></li>
        <li><a href="/hospital/create-request.html" class="sidebar-link"><span class="icon">➕</span> Create Request</a></li>
        <li><a href="/hospital/requests.html" class="sidebar-link active"><span class="icon">📋</span> View Requests</a></li>
        <li><a href="/hospital/donors.html" class="sidebar-link"><span class="icon">🔍</span> Find Donors</a></li>
      </ul>
    </aside>

    <main class="main-content">
      <div class="dashboard-header">
        <div class="dashboard-title">
          <h2>📋 Manage Blood Requests</h2>
          <p>View all active, pending, and fulfilled requests posted by your hospital</p>
        </div>
        <a href="/hospital/create-request.html" class="btn btn-primary">+ Create New Request</a>
      </div>

      <div class="table-responsive">
        <table class="table">
          <thead>
            <tr>
              <th>ID</th>
              <th>Blood Group</th>
              <th>Units Needed</th>
              <th>Location</th>
              <th>Urgency</th>
              <th>Status</th>
              <th>Action</th>
            </tr>
          </thead>
          <tbody id="hospitalRequestsTable">
            <!-- Loaded dynamically via hospital.js -->
          </tbody>
        </table>
      </div>
    </main>
  </div>

  <script src="/js/api.js"></script>
  <script src="/js/auth.js"></script>
  <script src="/js/hospital.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', loadHospitalDashboard);
  </script>
</body>
</html>
